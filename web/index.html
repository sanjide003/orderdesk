<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="OrderDesk — Smart WhatsApp Reply & Order CRM">
  <meta name="theme-color" content="#0F766E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OrderDesk">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>OrderDesk</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #F4F7F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F4F7F6;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.25);
    }
    .splash-title {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
    }
    .splash-sub {
      margin-top: 4px;
      font-size: 13px;
      color: #64748B;
    }
    .spinner {
      margin-top: 20px;
      width: 24px;
      height: 24px;
      border: 3px solid #CBD5E1;
      border-top-color: #0F766E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <img class="logo-img" src="icons/Icon-192.png" alt="OrderDesk Logo">
    <div class="splash-title">OrderDesk</div>
    <div class="splash-sub">Loading workspace...</div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 250);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
