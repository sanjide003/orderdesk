name: orderdesk
description: White-label WhatsApp Smart Reply, Dynamic Multi-Product Catalog, Custom Profile Variables & Order CRM (Flutter Android + Web).
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  intl: ^0.20.3
  http: ^1.6.0
  file_picker: ^13.4.1
  excel: ^4.0.6
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"
