name: orderdesk
description: White-label WhatsApp Smart Reply, Dynamic Multi-Product Catalog, Custom Profile Variables & Order CRM (Flutter Android + Web).
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  intl: ^0.20.3
  http: ^1.6.0
  file_picker: ^13.4.1
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
