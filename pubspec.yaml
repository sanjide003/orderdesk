name: orderdesk
description: White-label WhatsApp Smart Reply, Dynamic Multi-Product Catalog, Custom Profile Variables & Order CRM (Flutter Android + Web).
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  intl: ^0.19.0
  http: ^1.2.2
  file_picker: ^8.1.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
