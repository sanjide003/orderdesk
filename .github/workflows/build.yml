name: Fast Build (Android arm64 + Web to Vercel)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_web:
    name: Build Website & Publish web-dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Web Platform Files
        run: |
          if [ ! -d "web" ]; then
            flutter create --platforms=web --org com.wapp --project-name orderdesk .
          fi
      - run: flutter pub get
      - run: flutter build web --release
      - name: Add Vercel SPA Rewrite Config
        run: |
          cat << 'VJSON' > build/web/vercel.json
          {
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          VJSON
      - name: Publish Compiled Web to web-dist Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web-dist
          publish_dir: ./build/web
          force_orphan: true

  build_android:
    name: Build Android APK (arm64 Latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android Platform Files (com.wapp.orderdesk)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.wapp --project-name orderdesk .
          fi
      - name: Copy google-services.json & Skip Slow Release Lint
        run: |
          if [ -f "firebase/google-services.json" ]; then
            cp firebase/google-services.json android/app/google-services.json
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            printf '\nandroid { lint { checkReleaseBuilds = false; abortOnError = false } }\n' >> android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            printf '\nandroid { lintOptions { checkReleaseBuilds false; abortOnError false } }\n' >> android/app/build.gradle
          fi
      - run: flutter pub get
      - name: Build arm64 Android APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: orderdesk-android-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
