name: Build Android APK & Publish GitHub Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Android Release APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Persistent Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.android-signing
          key: orderdesk-release-keystore-v1

      - name: Generate Android Platform Files (com.wapp.orderdesk)
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            flutter create --platforms=android --org com.wapp --project-name orderdesk .
          fi

      - name: Configure Native Updater, FileProvider, Keystore & Permissions
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/configure_android.py

      - run: flutter pub get
      - name: Generate Custom Android App Icons
        run: dart run flutter_launcher_icons

      - name: Build Signed Release APK (Auto Build Number)
        run: |
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          flutter build apk --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_BUILD_NUMBER=$BUILD_NUMBER \
            --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Prepare Release Assets (APK + version.json)
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/orderdesk-latest.apk
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/orderdesk-b${BUILD_NUMBER}.apk"
          VER_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME=$(echo "$VER_LINE" | cut -d'+' -f1)
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 -c "import json; json.dump({'version': '$VER_NAME', 'buildNumber': int('$BUILD_NUMBER'), 'apkUrl': 'https://github.com/${{ github.repository }}/releases/download/latest/orderdesk-b${BUILD_NUMBER}.apk', 'updatedAt': '$NOW_UTC'}, open('release-assets/version.json', 'w'), indent=2)"

      - uses: actions/upload-artifact@v4
        with:
          name: orderdesk-android-release-apk
          path: release-assets/orderdesk-latest.apk

      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME=$(echo "$VER_LINE" | cut -d'+' -f1)
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "OrderDesk v${VER_NAME} (Build ${BUILD_NUMBER})" --notes "Signed release APK for OrderDesk with in-app self-update."
            OLD_ASSETS=$(gh release view latest --json assets --jq '.assets[].name' | grep '^orderdesk-b[0-9]\+\.apk$' || true)
            for asset in $OLD_ASSETS; do
              gh release delete-asset latest "$asset" --yes || true
            done
          else
            gh release create latest --title "OrderDesk v${VER_NAME} (Build ${BUILD_NUMBER})" --notes "Signed release APK for OrderDesk with in-app self-update."
          fi
          gh release upload latest release-assets/orderdesk-latest.apk "release-assets/orderdesk-b${BUILD_NUMBER}.apk" release-assets/version.json --clobber
