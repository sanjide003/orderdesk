name: Build Android APK & Publish GitHub Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Android APK (arm64) & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android Platform Files (com.wapp.orderdesk)
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            flutter create --platforms=android --org com.wapp --project-name orderdesk .
          fi
      - name: Copy google-services.json, Permissions & Skip Slow Release Lint
        run: |
          if [ -f "firebase/google-services.json" ]; then
            cp firebase/google-services.json android/app/google-services.json
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' "$MANIFEST"
            fi
            if ! grep -q "android:allowBackup" "$MANIFEST"; then
              sed -i 's|<application|<application android:allowBackup="false"|' "$MANIFEST"
            fi
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            printf '\nandroid { lint { checkReleaseBuilds = false; abortOnError = false } }\n' >> android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            printf '\nandroid { lintOptions { checkReleaseBuilds false; abortOnError false } }\n' >> android/app/build.gradle
          fi
      - run: flutter pub get
      - name: Generate Custom Android App Icons
        run: dart run flutter_launcher_icons
      - name: Build arm64 Android APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define=GITHUB_REPO=${{ github.repository }}
      - name: Prepare Release Assets (APK + version.json)
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/orderdesk-latest.apk
          VER_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME=$(echo "$VER_LINE" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$VER_LINE" | cut -d'+' -f2)
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat << VJSON > release-assets/version.json
          {
            "version": "$VER_NAME",
            "buildNumber": $BUILD_NUM,
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/orderdesk-latest.apk",
            "updatedAt": "$NOW_UTC"
          }
          VJSON
      - uses: actions/upload-artifact@v4
        with:
          name: orderdesk-android-arm64-apk
          path: release-assets/orderdesk-latest.apk
      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME=$(echo "$VER_LINE" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$VER_LINE" | cut -d'+' -f2)
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "OrderDesk v${VER_NAME} (Build ${BUILD_NUM})" --notes "Direct Android arm64 APK release for OrderDesk."
          else
            gh release create latest --title "OrderDesk v${VER_NAME} (Build ${BUILD_NUM})" --notes "Direct Android arm64 APK release for OrderDesk."
          fi
          gh release upload latest release-assets/orderdesk-latest.apk release-assets/version.json --clobber
