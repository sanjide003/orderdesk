name: Build Android APK & Publish GitHub Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Android Release APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Persistent Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.android-signing
          key: orderdesk-release-keystore-v1

      - name: Generate Android Platform Files (com.wapp.orderdesk)
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            flutter create --platforms=android --org com.wapp --project-name orderdesk .
          fi

      - name: Configure Native Updater, FileProvider, Keystore & Permissions
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "firebase/google-services.json" ]; then
            cp firebase/google-services.json android/app/google-services.json
          fi

          mkdir -p android/app/src/main/res/xml
          cp android_config/file_paths.xml android/app/src/main/res/xml/file_paths.xml

          mkdir -p android/app/src/main/kotlin/com/wapp/orderdesk
          cp android_config/MainActivity.kt android/app/src/main/kotlin/com/wapp/orderdesk/MainActivity.kt

          mkdir -p ~/.android-signing
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            STORE_PASS="${ANDROID_STORE_PASSWORD:-orderdesk2026}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-orderdesk}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$STORE_PASS}"
          else
            if [ ! -f ~/.android-signing/orderdesk-release.jks ]; then
              keytool -genkey -v \
                -keystore ~/.android-signing/orderdesk-release.jks \
                -storepass orderdesk2026 \
                -alias orderdesk \
                -keypass orderdesk2026 \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=OrderDesk, O=OrderDesk, C=IN"
            fi
            cp ~/.android-signing/orderdesk-release.jks android/app/release-keystore.jks
            STORE_PASS="orderdesk2026"
            KEY_ALIAS="orderdesk"
            KEY_PASS="orderdesk2026"
          fi

          cat << KPROPS > android/key.properties
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          KPROPS

          python3 - << 'PYPATCH'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest_path.read_text()
          if "android.permission.INTERNET" not in m:
              m = m.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in m:
              m = m.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application', 1)
          if "android:allowBackup" not in m:
              m = m.replace("<application", '<application android:allowBackup="false"', 1)
          if "androidx.core.content.FileProvider" not in m:
              provider = '''        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">
            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/file_paths" />
        </provider>
    </application>'''
              m = m.replace("</application>", provider, 1)
          manifest_path.write_text(m)

          kts_path = Path("android/app/build.gradle.kts")
          groovy_path = Path("android/app/build.gradle")
          if kts_path.exists():
              g = kts_path.read_text()
              if "key.properties" not in g:
                  header = '''import java.util.Properties
import java.io.FileInputStream

val keystoreProperties = Properties()
val keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(FileInputStream(keystorePropertiesFile))
}
'''
                  g = header + "\n" + g
              g = g.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              if 'create("release")' not in g:
                  signing_block = '''
android {
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties.getProperty("keyAlias")
            keyPassword = keystoreProperties.getProperty("keyPassword")
            storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
            storePassword = keystoreProperties.getProperty("storePassword")
        }
    }
    buildTypes {
        getByName("release") {
            signingConfig = signingConfigs.getByName("release")
        }
    }
}
'''
                  g = g + "\n" + signing_block
              kts_path.write_text(g)
          elif groovy_path.exists():
              g = groovy_path.read_text()
              if "key.properties" not in g:
                  header = '''def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
'''
                  g = header + "\n" + g
              g = g.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              if "signingConfigs" not in g or "release {" not in g:
                  signing_block = '''
android {
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
'''
                  g = g + "\n" + signing_block
              groovy_path.write_text(g)
          PYPATCH

      - run: flutter pub get
      - name: Generate Custom Android App Icons
        run: dart run flutter_launcher_icons

      - name: Build Signed Release APK (Auto Build Number)
        run: |
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          flutter build apk --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_BUILD_NUMBER=$BUILD_NUMBER \
            --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Prepare Release Assets (APK + version.json)
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/orderdesk-latest.apk
          VER_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME=$(echo "$VER_LINE" | cut -d'+' -f1)
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat << VJSON > release-assets/version.json
          {
            "version": "$VER_NAME",
            "buildNumber": $BUILD_NUMBER,
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/orderdesk-latest.apk",
            "updatedAt": "$NOW_UTC"
          }
          VJSON

      - uses: actions/upload-artifact@v4
        with:
          name: orderdesk-android-release-apk
          path: release-assets/orderdesk-latest.apk

      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME=$(echo "$VER_LINE" | cut -d'+' -f1)
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "OrderDesk v${VER_NAME} (Build ${BUILD_NUMBER})" --notes "Signed release APK for OrderDesk with in-app self-update."
          else
            gh release create latest --title "OrderDesk v${VER_NAME} (Build ${BUILD_NUMBER})" --notes "Signed release APK for OrderDesk with in-app self-update."
          fi
          gh release upload latest release-assets/orderdesk-latest.apk release-assets/version.json --clobber
